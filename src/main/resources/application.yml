spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    properties:
        hibernate:
            format_sql: true
            dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

scalar:
  enabled: true
  url: /v3/api-docs
  path: /scalar
  theme: saturn

springdoc:
  api-docs:
    path: /v3/api-docs

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:900000}
    refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION:604800000}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-account-limit: ${RATE_LIMIT_LOGIN_ACCOUNT:5}
    login-ip-limit: ${RATE_LIMIT_LOGIN_IP:150}
    refresh-token-limit: ${RATE_LIMIT_REFRESH_TOKEN:15}
    refresh-ip-limit: ${RATE_LIMIT_REFRESH_IP:300}
    register-ip-limit: ${RATE_LIMIT_REGISTER_IP:60}
    password-reset-ip-limit: ${RATE_LIMIT_PASSWORD_RESET_IP:30}
    window-millis: ${RATE_LIMIT_WINDOW_MILLIS:60000}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}
resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL}
password-reset:
  pepper: ${PASSWORD_RESET_PEPPER}
cloudinary:
  url: ${CLOUDINARY_URL:}

logging:
  level:
    org.bibliotecaviva: info

# Local caches and approximate view metrics; see docs/work-performance.md.
work:
  cache:
    front-page-ttl: ${WORK_FRONT_PAGE_TTL:30s}
    like-count-ttl: ${WORK_LIKE_COUNT_TTL:30s}
    like-count-max-size: ${WORK_LIKE_COUNT_MAX_SIZE:10000}
  views:
    flush-interval-ms: ${WORK_VIEW_FLUSH_INTERVAL_MS:10000}
    max-pending-works: ${WORK_VIEW_MAX_PENDING_WORKS:10000}
