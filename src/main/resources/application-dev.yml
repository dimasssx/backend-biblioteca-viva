spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bibliotecaviva}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed

logging:
  level:
    org.bibliotecaviva: info
    org.hibernate.SQL: debug
    org.flywaydb: info

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans
security:
  cookie:
    secure: false
    same-site: Lax