info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{api_url}}auth/login"
  body:
    type: json
    data: |-
      {
        "email":"aluno1@teste.com",
        "password": "123456"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body) {

          const token = res.body.accessToken
          if (token) {
            bru.setGlobalEnvVar("access_token", token);
          }
        }

        const rawCookie = res.getHeader('set-cookie');

        if (rawCookie) {
          let cookieHeaderValue = '';

          if (Array.isArray(rawCookie)) {

            cookieHeaderValue = rawCookie.map(c => c.split(';')[0]).join('; ');
          } else {
            cookieHeaderValue = rawCookie.split(';')[0];
          }

          bru.setGlobalEnvVar("session_cookie", cookieHeaderValue);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Login

  Autentica um usuario e salva o JWT retornado em `auth_token`.

  ## Respostas esperadas
  - `200`: credenciais validas e conta ativa. Retorna `token` e `email`.
  - `401`: email/senha invalidos.
  - `403`: conta pendente, rejeitada ou desativada.
