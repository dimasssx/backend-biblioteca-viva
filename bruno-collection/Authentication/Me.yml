info:
  name: Get Current User
  type: http
  seq: 10

http:
  method: GET
  url: "{{api_url}}auth/me"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Get Current User (Me)

  Retorna os dados cadastrais básicos do usuário autenticado no momento.

  ## Autenticação
  - Requer cabeçalho `Authorization: Bearer {{access_token}}`.

  ## Respostas esperadas
  - `200`: Dados do usuário autenticado (`id`, `name`, `email`).
  - `401`: Não autenticado, token ausente ou inválido.
