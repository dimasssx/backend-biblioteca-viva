docs: |-
  A atualização exige exatamente um entre authorEmail e authorName, não vazio.
  Autoria ausente ou ambígua e ID de outro subtipo retornam 400, antes de alterações ou upload.

  # Update Infographic (Infográfico)

  Atualiza uma obra visual do tipo Infográfico existente.
  Requer usuário autenticado com perfil `ADMIN` ou `CURADOR`.

  ## Formato da Requisição
  - Content-Type: `multipart/form-data`
  - Part `data` (`application/json`): Campos a atualizar.
  - Part `image` (`file` - Opcional): Se fornecida, faz upload de nova imagem e substitui a URL. Se omitida/vazia, a URL anterior é mantida.

  ## Respostas Esperadas
  - `200`: Obra atualizada com sucesso.
  - `400`: Formato de imagem inválido ou campos inválidos.
  - `404`: Obra ou autor não encontrado.
