info:
  name: Liked Works
  type: http
  seq: 8

http:
  method: GET
  url: "{{api_url}}work/liked"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Liked Works (Obras Curtidas)

  Retorna uma lista contendo os UUIDs de todas as obras curtidas pelo usuário atualmente autenticado.

  ## Autenticação
  - Requer usuário autenticado (`ALUNO`, `CURADOR` ou `ADMIN`).

  ## Respostas esperadas
  - `200`: Lista de UUIDs das obras curtidas pelo usuário.
  - `401`: Não autenticado.
