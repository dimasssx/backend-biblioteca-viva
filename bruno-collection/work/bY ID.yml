info:
  name: bY ID
  type: http
  seq: 1

http:
  method: GET
  url: "{{api_url}}work/{{work_id}}"
  auth: inherit

runtime:
  variables:
    - name: id
      value: 88888888-8888-8888-8888-888888888003
  scripts:
    - type: after-response
      code: bru.setGlobalEnvVar("work_id", res.getBody().id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Get Work by ID

  Retorna os detalhes completos de uma obra a partir de seu UUID, incrementando atomicamente o contador de visualizações (`viewCount`).

  ## Acesso
  - Rota pública. Não exige autenticação.
  - Salva o `id` da obra retornada na variável global `work_id`.

  ## Respostas esperadas
  - `200`: Detalhes da obra de acordo com seu subtipo polimórfico.
  - `400`: Formato de UUID inválido.
  - `404`: Obra não encontrada.
