docs: |-
  # Update Article

  Atualiza uma obra do tipo Artigo (`Article`). Requer usuário autenticado com perfil `ADMIN` ou `CURADOR`.

  ## Regras de Autoria e Validação
  - Exige exatamente um identificador de autoria: `authorEmail` ou `authorName`.
  - O `id` informado na rota deve pertencer a uma obra do subtipo `Article`.
  - Campos obrigatórios: `title`, `description`, `content`, `studentClass`, `publicationDate`.

  ## Respostas esperadas
  - `200`: Artigo atualizado com sucesso.
  - `400`: Dados inválidos, autoria ambígua ou ID de outro subtipo.
  - `401`: Token ausente ou inválido.
  - `403`: Usuário sem perfil `ADMIN` ou `CURADOR`.
  - `404`: Obra ou autor não encontrado.
  - `409`: Já existe outra obra com o mesmo autor e título.
