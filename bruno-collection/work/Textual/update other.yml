docs: |-
  A atualização exige exatamente um entre authorEmail e authorName, não vazio.
  Autoria ausente ou ambígua e ID de outro subtipo retornam 400, antes de alterações ou upload.

  # Update Other

  Atualiza uma obra da categoria geral. Requer usuario autenticado com perfil
  `ADMIN` ou `CURADOR`.

  ## Formato da requisicao
  - Content-Type: `multipart/form-data`
  - Part `data` (`application/json`): campos a atualizar. Nao inclui `imageUrl`.
  - Part `image` (`file`, opcional): se enviada, sobe a nova imagem para o
    Cloudinary e substitui a anterior. Se omitida, a imagem atual e preservada.
    Formatos: `.jpg`, `.jpeg`, `.png`.

  ## Regras importantes
  - `authorEmail` deve apontar para um usuario cadastrado.
  - `url` continua opcional; endereco invalido retorna `400`.

  ## Respostas esperadas
  - `200`: obra atualizada, com `"type": "Other"`.
  - `400`: `url` invalida, imagem em formato nao permitido ou arquivo vazio.
  - `404`: obra ou autor nao encontrado.
  - `409`: ja existe obra com o mesmo autor e titulo.
