docs: |-
  # Update Poem

  Atualiza uma obra do tipo Poema (`Poem`). Requer usuário autenticado com perfil `ADMIN` ou `CURADOR`.

  ## Regras de Autoria e Validação
  - Exige exatamente um identificador de autoria: `authorEmail` (para usuário cadastrado) ou `authorName` (autor externo). Enviar ambos ou nenhum resulta em `400`.
  - O `id` informado na rota deve pertencer a uma obra do subtipo `Poem`; se pertencer a outro subtipo, retorna `400`.
  - Campos obrigatórios: `title`, `description`, `content`, `rhymeScheme`, `poemType`, `studentClass`, `publicationDate`.

  ## Respostas esperadas
  - `200`: Poema atualizado com sucesso.
  - `400`: Dados inválidos, autoria ambígua/ausente ou ID incompatível com subtipo.
  - `401`: Token ausente ou inválido.
  - `403`: Usuário sem perfil `ADMIN` ou `CURADOR`.
  - `404`: Obra ou autor não encontrado.
  - `409`: Já existe outra obra com o mesmo autor e título.
