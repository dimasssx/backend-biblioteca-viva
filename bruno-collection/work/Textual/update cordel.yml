docs: |-
  # Update Cordel

  Atualiza uma obra do tipo Cordel (`Cordel`). Requer usuário autenticado com perfil `ADMIN` ou `CURADOR`.

  ## Regras de Autoria e Ilustração
  - Exige exatamente um identificador de autoria: `authorEmail` ou `authorName`.
  - `artName` é opcional. Se enviado, vincula o cordel à ilustração existente com esse título (`illustration`). Se for `null` ou omitido, a ilustração vinculada é limpa.
  - O `id` informado na rota deve pertencer a uma obra do subtipo `Cordel`.

  ## Respostas esperadas
  - `200`: Cordel atualizado com sucesso.
  - `400`: Dados inválidos, autoria ambígua ou ID de outro subtipo.
  - `401`: Token ausente ou inválido.
  - `403`: Usuário sem perfil `ADMIN` ou `CURADOR`.
  - `404`: Obra, autor ou arte (`artName`) não encontrada.
  - `409`: Já existe outra obra com o mesmo autor e título.
