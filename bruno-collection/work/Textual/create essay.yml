docs: |-
  # Create Essay (Redação)

  Cria uma obra do tipo Redação (`Essay`). Requer perfil `ADMIN` ou `CURADOR`.

  ## Regras
  - Exige exatamente um identificador de autoria: `authorEmail` ou `authorName`.
  - `rate` deve ser um número inteiro entre 0 e 1000.
  - Campos obrigatórios: `title`, `description`, `content`, `rate`, `theme`, `themeDescription`, `feedback`, `studentClass`, `publicationDate`.

  ## Respostas esperadas
  - `201`: Redação criada com sucesso.
  - `400`: Dados inválidos ou nota fora do intervalo [0, 1000].
  - `401`: Não autenticado.
  - `403`: Acesso negado.
  - `409`: Já existe obra com mesmo autor e título.
