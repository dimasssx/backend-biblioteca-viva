docs: |-
  # Update Essay (Redação)

  Atualiza uma obra do tipo Redação (`Essay`). Requer usuário autenticado com perfil `ADMIN` ou `CURADOR`.

  ## Regras de Autoria e Validação
  - Exige exatamente um identificador de autoria: `authorEmail` ou `authorName`.
  - `rate` deve ser um valor inteiro entre 0 e 1000.
  - Campos obrigatórios: `title`, `description`, `content`, `rate`, `theme`, `themeDescription`, `feedback`, `studentClass`, `publicationDate`.
  - O `id` informado na rota deve pertencer a uma obra do subtipo `Essay`.

  ## Respostas esperadas
  - `200`: Redação atualizada com sucesso.
  - `400`: Dados inválidos, nota fora do intervalo [0, 1000] ou ID de outro subtipo.
  - `401`: Token ausente ou inválido.
  - `403`: Usuário sem perfil `ADMIN` ou `CURADOR`.
  - `404`: Obra ou autor não encontrado.
  - `409`: Já existe outra obra com o mesmo autor e título.
