docs: |-
  # Update Multimedia

  Atualiza uma obra do tipo Multimídia (`Multimedia`). Requer usuário autenticado com perfil `ADMIN` ou `CURADOR`.

  ## Regras de Autoria e Validação
  - Exige exatamente um identificador de autoria: `authorEmail` ou `authorName`.
  - `url` deve ser uma URL válida.
  - `duration` deve estar no formato ISO 8601 (ex.: `PT2M30S`, `PT5M`, `PT45S`).
  - O `id` informado na rota deve pertencer a uma obra do subtipo `Multimedia`.

  ## Respostas esperadas
  - `200`: Multimídia atualizada com sucesso.
  - `400`: Dados inválidos, formato de duração inválido ou ID de outro subtipo.
  - `401`: Token ausente ou inválido.
  - `403`: Usuário sem perfil `ADMIN` ou `CURADOR`.
  - `404`: Obra ou autor não encontrado.
  - `409`: Já existe outra obra com o mesmo autor e título.
