docs: |-
  # Create Multimedia

  Cria uma obra audiovisual do tipo Multimídia (`Multimedia`). Requer perfil `ADMIN` ou `CURADOR`.

  ## Regras
  - Exige exatamente um identificador de autoria: `authorEmail` ou `authorName`.
  - `url` deve ser uma URL válida.
  - `duration` deve estar no formato ISO 8601 (ex.: `PT2M30S`, `PT5M`).

  ## Respostas esperadas
  - `201`: Multimídia criada com sucesso.
  - `400`: Dados inválidos ou formato de duração inválido.
  - `401`: Não autenticado.
  - `403`: Acesso negado.
  - `409`: Já existe obra com mesmo autor e título.
