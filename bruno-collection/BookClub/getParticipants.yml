info:
  name: getParticipants
  type: http
  seq: 10

http:
  method: GET
  url: "{{api_url}}bookclub/{{id}}/participants"
  auth: inherit

runtime:
  variables:
    - name: id
      value: cb1361d5-05f0-4079-b985-42c78adc6f54

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Get Book Club Participants (Participantes do Clube do Livro)

  Lista todos os usuários inscritos no encontro do Clube do Livro especificado.

  ## Acesso
  - Rota pública. Não exige autenticação.

  ## Respostas esperadas
  - `200`: Lista de participantes inscritos.
  - `400`: Formato de ID inválido.
  - `404`: Clube do livro não encontrado.
