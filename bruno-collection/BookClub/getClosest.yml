info:
  name: getClosest
  type: http
  seq: 2

http:
  method: GET
  url: "{{api_url}}bookclub/next"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Get Next Book Club (Próximo Clube do Livro)

  Retorna o próximo encontro agendado do Clube do Livro (o mais próximo a partir da data atual).

  ## Acesso
  - Rota pública. Não exige autenticação.

  ## Respostas esperadas
  - `200`: Encontro do clube do livro encontrado.
  - `404`: Nenhum clube do livro futuro agendado.
