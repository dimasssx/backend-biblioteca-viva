info:
  name: unsubscribe
  type: http
  seq: 8

http:
  method: POST
  url: "{{api_url}}bookclub/{{id}}/unsubscribe"
  auth: inherit

runtime:
  variables:
    - name: id
      value: 33333333-3333-3333-3333-333333333003

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Unsubscribe from Book Club (Cancelar Inscrição no Clube do Livro)

  Cancela a inscrição do usuário autenticado no encontro do Clube do Livro.

  ## Autenticação
  - Requer usuário autenticado (qualquer perfil).

  ## Respostas esperadas
  - `200`: Inscrição cancelada com sucesso.
  - `400`: Formato de ID inválido.
  - `401`: Não autenticado.
  - `404`: Clube do livro não encontrado ou usuário não estava inscrito.
