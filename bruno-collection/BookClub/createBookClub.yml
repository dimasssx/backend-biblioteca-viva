info:
  name: createBookClub
  type: http
  seq: 1

http:
  method: POST
  url: "{{api_url}}bookclub"
  body:
    type: json
    data: |-
      {
        "bookName": "O hobit",
        "bookSynopses": "Uma aventura épica de um hobbit relutante que viaja para a Montanha Solitária para recuperar um tesouro guardado por um dragão.",
        "bookAuthor": "J.R.R. Tolkien",
        "date": "2026-12-30T19:30:00",
        "location": "Biblioteca Municipal",
        "bookCoverUrl": "https://tolkienlibrary.com/press/images/movie-tie-in-the-hobbit.jpg"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Create Book Club (Criar Clube do Livro)

  Cria um novo encontro do Clube do Livro.

  ## Permissões
  - Requer perfil `ADMIN` ou `CURADOR`.

  ## Campos
  - `bookName`: Título do livro em debate.
  - `bookSynopses`: Sinopse ou descrição do livro.
  - `bookAuthor`: Autor da obra.
  - `date`: Data e hora do encontro (formato ISO 8601).
  - `location`: Local físico ou link do encontro.
  - `bookCoverUrl`: URL da capa do livro.

  ## Respostas esperadas
  - `201`: Clube do livro criado com sucesso.
  - `400`: Dados inválidos no corpo da requisição.
  - `401`: Não autenticado.
  - `403`: Acesso negado (usuário não é admin ou curador).
