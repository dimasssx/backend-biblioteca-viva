docs: |-
  # Update Book Club (Atualizar Clube do Livro)

  Atualiza os dados de um encontro do Clube do Livro.

  ## Permissões
  - Requer perfil `ADMIN` ou `CURADOR`.

  ## Respostas esperadas
  - `200`: Clube do livro atualizado com sucesso.
  - `400`: Dados inválidos ou ID inválido.
  - `401`: Não autenticado.
  - `403`: Acesso negado.
  - `404`: Clube do livro não encontrado.
