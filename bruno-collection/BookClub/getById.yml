info:
  name: getById
  type: http
  seq: 4

http:
  method: GET
  url: "{{api_url}}bookclub/{{id}}"
  auth: inherit

runtime:
  variables:
    - name: id
      value: 11111111-1111-1111-1111-111111111001

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Get Book Club by ID (Buscar Clube do Livro por ID)

  Retorna os detalhes de um encontro específico do Clube do Livro pelo seu identificador UUID.

  ## Acesso
  - Rota pública. Não exige autenticação.

  ## Respostas esperadas
  - `200`: Detalhes do encontro do clube do livro.
  - `400`: Formato de UUID inválido.
  - `404`: Clube do livro não encontrado.
