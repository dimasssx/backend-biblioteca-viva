info:
  name: create Review
  type: http
  seq: 1

http:
  method: POST
  url: "{{api_url}}bookclub/{{bookclub_id}}/reviews"
  body:
    type: json
    data: |-
      {
        "content": "MUDOU MINHA VIDA.",
        "rating": 5
      }
  auth: inherit

runtime:
  variables:
    - name: bookclub_id
      value: 33333333-3333-3333-3333-333333333003

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Create Book Club Review (Criar Avaliação do Clube do Livro)

  Cria uma avaliação com nota e comentário sobre um encontro do Clube do Livro.

  ## Autenticação
  - Requer usuário autenticado.

  ## Campos
  - `content`: Texto do comentário/avaliação.
  - `rating`: Nota de 1 a 5.

  ## Respostas esperadas
  - `201`: Avaliação criada com sucesso.
  - `400`: Dados inválidos ou nota fora do intervalo.
  - `401`: Não autenticado.
  - `404`: Clube do livro não encontrado.
