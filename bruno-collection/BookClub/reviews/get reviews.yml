info:
  name: get reviews
  type: http
  seq: 2

http:
  method: GET
  url: "{{api_url}}bookclub/{{bookclub_id}}/reviews"
  auth: inherit

runtime:
  variables:
    - name: bookclub_id
      value: 11111111-1111-1111-1111-111111111001

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Get Book Club Reviews (Listar Avaliações do Clube)

  Retorna a lista paginada de avaliações de um clube do livro, ordenadas pela mais recente.

  ## Acesso
  - Rota pública. Não exige autenticação.

  ## Respostas esperadas
  - `200`: Página contendo a lista de avaliações.
  - `404`: Clube do livro não encontrado.
