opencollection: 1.0.0

info:
  name: bruno-collection
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  headers:
    - name: Cookie
      value: "{{session_cookie}}"
  auth:
    type: bearer
    token: "{{access_token}}"
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
