info:
  name: getUsers
  type: http
  seq: 1

http:
  method: GET
  url: "{{api_url}}admin?status=&page="
  params:
    - name: status
      value: ""
      type: query
    - name: page
      value: ""
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Get Users (Listar Usuários - Painel Admin)

  Lista usuários de forma paginada no painel administrativo, com suporte a filtro por status.

  ## Parâmetros
  - `status` (opcional): `ACTIVE`, `PENDING`, `BLOCKED`, `REJECTED`.
  - `page` (opcional): número da página (0-indexed).
  - `size` (opcional): tamanho da página (padrão 10).

  ## Permissões
  - Requer perfil `ADMIN`.

  ## Respostas esperadas
  - `200`: Página contendo a lista de usuários.
  - `400`: Valor de status inválido.
  - `401`: Não autenticado.
  - `403`: Acesso negado.
